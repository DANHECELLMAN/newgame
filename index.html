<script>
(function(root,factory){
  const api=factory();
  if(typeof module==='object' && module.exports) module.exports=api;
  root.PawCore=api;
})(typeof globalThis!=='undefined'?globalThis:this,function(){
  'use strict';

  const DEFAULT_COLS=6, DEFAULT_ROWS=8;
  const DIRS={
    R:{dc:1,dr:0,arrow:'→'}, L:{dc:-1,dr:0,arrow:'←'},
    U:{dc:0,dr:-1,arrow:'↑'}, D:{dc:0,dr:1,arrow:'↓'}
  };

  function cidx(ch){ return ch.charCodeAt(0)-65; }
  function parseCell(s){ return {c:cidx(s[0]),r:Number(s.slice(1))-1}; }
  function key(c,r){ return `${c},${r}`; }
  function dims(level){ return {cols:level.cols||DEFAULT_COLS,rows:level.rows||DEFAULT_ROWS}; }
  function cloneState(state){
    return {
      animals: state.animals.map(a=>({...a})),
      switches:[...(state.switches||[])],
      toggles:[...(state.toggles||[])],
      crumbled:[...(state.crumbled||[])],
      moves:state.moves||0,
      failed:!!state.failed,
      failReason:state.failReason||null
    };
  }
  function createLevelRuntime(level){
    const tiles=new Map();
    (level.tiles||[]).forEach(t=>{
      const p=parseCell(t[0]);
      tiles.set(key(p.c,p.r),{type:t[1],arg:t[2]??null,arg2:t[3]??null,assetId:t[4]??null,cell:t[0]});
    });
    return {...level,...dims(level),_tiles:tiles};
  }
  function createInitialState(level){
    return {
      animals:level.animals.map((a,id)=>{
        const p=parseCell(a[1]);
        return {id,breed:a[0],assetId:a[3]??null,c:p.c,r:p.r,dir:a[2],rescued:false,stuck:false,fallen:false};
      }),
      switches:[],toggles:[],crumbled:[],moves:0,failed:false,failReason:null
    };
  }
  function occupied(state,c,r,ignoreId=-1){
    return state.animals.find(a=>!a.rescued && !a.fallen && a.id!==ignoreId && a.c===c && a.r===r) || null;
  }
  function tileAt(level,c,r){ return level._tiles.get(key(c,r)) || {type:'floor',arg:null,arg2:null}; }
  function switchOn(state,id){ return (state.switches||[]).includes(id); }
  function toggleOn(state,id){ return (state.toggles||[]).includes(id); }
  function crumbled(state,cell){ return (state.crumbled||[]).includes(cell); }
  function plateOccupied(level,state,id){
    for(const [k,t] of level._tiles){
      if(t.type==='plate' && t.arg===id){
        const [c,r]=k.split(',').map(Number);
        if(occupied(state,c,r,-1)) return true;
      }
    }
    return false;
  }
  function doorOpen(level,state,tile){
    if(tile.type==='doorSwitch') return switchOn(state,tile.arg);
    if(tile.type==='doorPlate') return plateOccupied(level,state,tile.arg);
    if(tile.type==='doorToggle' || tile.type==='toggleWall'){
      const on=toggleOn(state,tile.arg);
      return tile.arg2==='off' ? !on : on;
    }
    return true;
  }
  function hazardSafe(state,tile){
    if(tile.type!=='hazard') return true;
    return !!tile.arg && switchOn(state,tile.arg);
  }
  function oneWayAllows(tile,dir){ return tile.type!=='oneway' || tile.arg===dir; }
  function portalPair(level,c,r,id){
    for(const [k,t] of level._tiles){
      if(t.type!=='portal'||t.arg!==id) continue;
      const [pc,pr]=k.split(',').map(Number);
      if(pc!==c||pr!==r) return {c:pc,r:pr};
    }
    return null;
  }
  function isSolved(state){ return !state.failed && state.animals.every(a=>a.rescued); }
  function isFailed(state){ return !!state.failed || state.animals.some(a=>a.fallen); }

  function toggleId(next,id){
    const i=next.toggles.indexOf(id);
    if(i>=0) next.toggles.splice(i,1); else next.toggles.push(id);
    next.toggles.sort();
    return next.toggles.includes(id);
  }

  /** Pure rules function. Returns a new state and a movement trace. */
  function simulateAction(level,state,animalId){
    const next=cloneState(state);
    const a=next.animals[animalId];
    const trace=[];
    let effect=null;
    if(!a || a.rescued || a.fallen || next.failed) return {state:next,trace,effect,changed:false};

    next.moves=(next.moves||0)+1;
    if(a.stuck){
      a.stuck=false;
      return {state:next,trace,effect:{type:'unstick'},changed:true};
    }

    let c=a.c,r=a.r,dir=a.dir;
    const {cols,rows}=dims(level);
    for(let guard=0;guard<240;guard++){
      const d=DIRS[dir];
      const nc=c+d.dc,nr=r+d.dr;
      if(nc<0||nc>=cols||nr<0||nr>=rows) break;
      if(occupied(next,nc,nr,a.id)) break;
      const t=tileAt(level,nc,nr);
      if(t.type==='wall' || t.type==='void') break;
      if((t.type==='doorSwitch'||t.type==='doorPlate'||t.type==='doorToggle'||t.type==='toggleWall') && !doorOpen(level,next,t)) break;
      if(t.type==='oneway' && !oneWayAllows(t,dir)) break;

      // A previously broken floor is a hard failure when entered again.
      if(t.type==='crumble' && crumbled(next,t.cell) && !(t.arg && switchOn(next,t.arg))){
        c=nc;r=nr;trace.push({c,r});
        a.fallen=true;next.failed=true;next.failReason=`crumble:${t.cell}`;
        effect={type:'crumbleFail',cell:t.cell,id:t.arg||null};
        break;
      }

      c=nc;r=nr;
      const step={c,r};
      trace.push(step);
      if(t.type==='exit'){
        effect={type:'rescue'};
        a.rescued=true;
        break;
      }
      if(t.type==='turn'){
        dir=t.arg;step.dir=dir;continue;
      }
      if(t.type==='switch'){
        if(!switchOn(next,t.arg)){
          next.switches.push(t.arg);next.switches.sort();
          effect={type:'switch',id:t.arg};break;
        }
        continue;
      }
      if(t.type==='toggle'){
        const on=toggleId(next,t.arg);
        effect={type:'toggle',id:t.arg,on};
        break;
      }
      if(t.type==='plate'){
        effect={type:'plate',id:t.arg};
        break;
      }
      if(t.type==='mud' || t.type==='trap'){
        if(t.arg && switchOn(next,t.arg)) continue;
        a.stuck=true;effect={type:'mud',id:t.arg||null};break;
      }
      if(t.type==='hazard' && !hazardSafe(next,t)){
        a.fallen=true;next.failed=true;next.failReason=`hazard:${t.cell}`;
        effect={type:'hazard',cell:t.cell,id:t.arg};break;
      }
      if(t.type==='crumble'){
        // Optional stabilizer switch: once ON, fragile flooring no longer breaks.
        // Unstabilized flooring breaks on first entry and stops that animal; later re-entry is fatal.
        if(!(t.arg && switchOn(next,t.arg))){
          if(!next.crumbled.includes(t.cell)) next.crumbled.push(t.cell);
          next.crumbled.sort();
          step.crumble=true;
          effect={type:'crumble',cell:t.cell,id:t.arg||null};
          break;
        }
        continue;
      }
      if(t.type==='portal'){
        const pair=portalPair(level,c,r,t.arg);
        if(pair && !occupied(next,pair.c,pair.r,a.id)){
          c=pair.c;r=pair.r;trace.push({c,r,teleport:true});
          effect={type:'portal',id:t.arg};
        }
        break;
      }
    }

    a.c=c;a.r=r;a.dir=dir;
    const changed=trace.length>0 || !!effect;
    return {state:next,trace,effect,changed};
  }

  function stateKey(state){
    const animals=state.animals.map(a=>a.rescued?'X':a.fallen?'F':`${a.c},${a.r},${a.dir},${a.stuck?'1':'0'}`).join('|');
    return `${animals}#S:${[...(state.switches||[])].sort().join(',')}#T:${[...(state.toggles||[])].sort().join(',')}#C:${[...(state.crumbled||[])].sort().join(',')}#${state.failed?'1':'0'}`;
  }

  return {
    DEFAULT_COLS,DEFAULT_ROWS,DIRS,parseCell,key,dims,createLevelRuntime,createInitialState,
    cloneState,simulateAction,isSolved,isFailed,stateKey,tileAt,doorOpen,plateOccupied,
    hazardSafe,oneWayAllows,switchOn,toggleOn,crumbled
  };
});

</script>

 'use strict';

 function reconstruct(nodes,idx){
   const out=[];
   while(idx>0){out.push(nodes[idx].action);idx=nodes[idx].parent;}
   return out.reverse();
 }

 function solveFrom(level,startState,opts={}){
   const maxStates=opts.maxStates||level.solverMax||900000;
   const start=C.cloneState(startState);
   if(C.isFailed(start)) return {solvable:false,minMoves:null,path:null,visited:1,failed:true};
   if(C.isSolved(start)) return {solvable:true,minMoves:0,path:[],visited:1};
   const nodes=[{state:start,parent:-1,action:-1,depth:0}];
   const seen=new Set([C.stateKey(start)]);let head=0;
   while(head<nodes.length && seen.size<=maxStates){
     const cur=nodes[head];
     for(const a of cur.state.animals){
       if(a.rescued||a.fallen) continue;
       const res=C.simulateAction(level,cur.state,a.id);
       if(!res.changed || C.isFailed(res.state)) continue;
       const k=C.stateKey(res.state);if(seen.has(k)) continue;
       const node={state:res.state,parent:head,action:a.id,depth:cur.depth+1};
       if(C.isSolved(res.state)){
         nodes.push(node);const idx=nodes.length-1;
         return {solvable:true,minMoves:node.depth,path:reconstruct(nodes,idx),visited:seen.size+1};
       }
       seen.add(k);nodes.push(node);if(seen.size>maxStates) break;
     }
     head++;
   }
   return {solvable:false,minMoves:null,path:null,visited:seen.size,truncated:seen.size>maxStates};
 }

 // Relaxed single-animal click lower bound. Doors, hazards, switches, mud,
 // crumble and other animals are ignored; only unavoidable plate/toggle/portal
 // stops remain. This cannot overestimate the real number of clicks.
 function relaxedAnimalClicks(level,animal){
   if(animal.rescued) return 0;
   let c=animal.c,r=animal.r,dir=animal.dir;
   let clicks=animal.stuck?1:0;
   const maxClicks=24,{cols,rows}=C.dims(level);
   for(let action=0;action<maxClicks;action++){
     clicks++;
     let moved=false;
     for(let guard=0;guard<220;guard++){
       const d=C.DIRS[dir],nc=c+d.dc,nr=r+d.dr;
       if(nc<0||nc>=cols||nr<0||nr>=rows) return Math.max(1,clicks-1);
       const t=C.tileAt(level,nc,nr);
       if(t.type==='wall' || t.type==='void') return Math.max(1,clicks-1);
       c=nc;r=nr;moved=true;
       if(t.type==='exit') return clicks;
       if(t.type==='turn'){dir=t.arg;continue;}
       if(t.type==='plate'||t.type==='toggle') break;
       if(t.type==='portal'){
         let pair=null;
         for(const [k,pt] of level._tiles){
           if(pt.type!=='portal'||pt.arg!==t.arg) continue;
           const [pc,pr]=k.split(',').map(Number);
           if(pc!==c||pr!==r){pair={c:pc,r:pr};break;}
         }
         if(pair){c=pair.c;r=pair.r;}break;
       }
       // relaxed: all other mechanisms are pass-through
     }
     if(!moved) return Math.max(1,clicks-1);
   }
   return 1;
 }
 function relaxedHeuristic(level,state){
   let h=0;for(const a of state.animals) if(!a.rescued&&!a.fallen) h+=relaxedAnimalClicks(level,a);return h;
 }

 class MinHeap{
   constructor(){this.a=[];}
   push(x){const a=this.a;a.push(x);let i=a.length-1;while(i){const p=(i-1)>>1;if(compare(a[p],x)<=0)break;a[i]=a[p];i=p;}a[i]=x;}
   pop(){const a=this.a;if(!a.length)return null;const top=a[0],last=a.pop();if(a.length){let i=0;while(true){let l=i*2+1,r=l+1;if(l>=a.length)break;let m=(r<a.length&&compare(a[r],a[l])<0)?r:l;if(compare(a[m],last)>=0)break;a[i]=a[m];i=m;}a[i]=last;}return top;}
   get length(){return this.a.length;}
 }
 function compare(x,y){return x.f-y.f || x.h-y.h || x.g-y.g || x.seq-y.seq;}

 function solveAStarFrom(level,startState,opts={}){
   const maxStates=opts.maxStates||level.solverMax||1600000;
   const start=C.cloneState(startState);const sk=C.stateKey(start);
   const nodes=[{state:start,parent:-1,action:-1,g:0}];
   const bestG=new Map([[sk,0]]);const heap=new MinHeap();let seq=0;
   const h0=relaxedHeuristic(level,start);heap.push({idx:0,g:0,h:h0,f:h0,seq:seq++});
   let expanded=0;
   while(heap.length && bestG.size<=maxStates){
     const item=heap.pop(),curNode=nodes[item.idx],cur=curNode.state;
     const ck=C.stateKey(cur);if(bestG.get(ck)!==item.g) continue;
     if(C.isSolved(cur)) return {solvable:true,minMoves:item.g,path:reconstruct(nodes,item.idx),visited:bestG.size,expanded,algorithm:'A*'};
     expanded++;
     for(const a of cur.animals){
       if(a.rescued||a.fallen) continue;
       const res=C.simulateAction(level,cur,a.id);if(!res.changed||C.isFailed(res.state))continue;
       const k=C.stateKey(res.state),g=item.g+1,old=bestG.get(k);if(old!==undefined&&old<=g)continue;
       const node={state:res.state,parent:item.idx,action:a.id,g};nodes.push(node);const idx=nodes.length-1;bestG.set(k,g);
       const h=relaxedHeuristic(level,res.state);heap.push({idx,g,h,f:g+h,seq:seq++});
       if(bestG.size>maxStates)break;
     }
   }
   return {solvable:false,minMoves:null,path:null,visited:bestG.size,expanded,truncated:bestG.size>maxStates,algorithm:'A*'};

 function solveAStar(level,opts={}){return solveAStarFrom(level,C.createInitialState(level),opts);}


 function buildReachableGraph(level,opts={}){
   const maxStates=opts.maxStates||25000;
   const start=C.createInitialState(level);
   const states=[start], keys=[C.stateKey(start)], edges=[[]], solved=[];
   const index=new Map([[keys[0],0]]); let head=0, failedTransitions=0, changedTransitions=0;
   while(head<states.length && states.length<maxStates){
     const st=states[head]; solved[head]=C.isSolved(st);
     for(const a of st.animals){
       if(a.rescued||a.fallen) continue;
       const res=C.simulateAction(level,st,a.id);
       if(!res.changed) continue;
       changedTransitions++;
       if(C.isFailed(res.state)){failedTransitions++;continue;}
       const k=C.stateKey(res.state);let idx=index.get(k);
       if(idx===undefined){
         if(states.length>=maxStates) continue;
         idx=states.length;index.set(k,idx);states.push(res.state);keys.push(k);edges.push([]);
       }
       edges[head].push(idx);
     }
     head++;
   }
   const truncated=head<states.length || states.length>=maxStates;
   for(let i=solved.length;i<states.length;i++) solved[i]=C.isSolved(states[i]);
   let canSolveCount=0, deadCount=0;
   if(!truncated){
     const rev=Array.from({length:states.length},()=>[]);
     edges.forEach((arr,i)=>arr.forEach(j=>rev[j].push(i)));
     const good=new Uint8Array(states.length),q=[];
     solved.forEach((v,i)=>{if(v){good[i]=1;q.push(i)}});
     for(let qi=0;qi<q.length;qi++){for(const p of rev[q[qi]])if(!good[p]){good[p]=1;q.push(p)}}
     for(let i=0;i<states.length;i++){if(good[i])canSolveCount++;else if(!solved[i])deadCount++;}
   }else{
     let terminal=0;
     for(let i=0;i<states.length;i++)if(!solved[i] && edges[i].length===0)terminal++;

   }
   return {states:states.length,expanded:head,truncated,deadCount,canSolveCount,deadRatio:states.length?deadCount/states.length:0,failedTransitions,changedTransitions};

 function analyzeOpening(level,overall,opts={}){
   const start=C.createInitialState(level),moves=[];
   const exactCap=opts.maxStates||40000;
   const fastCap=opts.fastMaxStates||12000;
   const complex=!!(overall&&overall.visited>50000);
   const maxStates=complex?fastCap:exactCap;
   for(const a of start.animals){
     const res=C.simulateAction(level,start,a.id);
     if(!res.changed){moves.push({animalId:a.id,status:'none',total:null,extra:null});continue;}
     if(C.isFailed(res.state)){moves.push({animalId:a.id,status:'dead',total:null,extra:null,reason:'immediate'});continue;}
     // The first action on the known optimal path is guaranteed optimal and needs no extra search.
     if(overall&&overall.solvable&&overall.path&&overall.path[0]===a.id){
       moves.push({animalId:a.id,status:'optimal',total:overall.minMoves,extra:0,certified:true});continue;
     }
     if(C.isSolved(res.state)){
       const total=1,extra=overall&&overall.solvable?Math.max(0,total-overall.minMoves):0;

     }
     const rest=solveAStarFrom(level,res.state,{maxStates});
     if(!rest.solvable){

     }
     const total=1+rest.minMoves,extra=overall&&overall.solvable?Math.max(0,total-overall.minMoves):0;

   const optimal=moves.filter(m=>m.status==='optimal').length;
   const falseChoices=moves.filter(m=>['dead','detour','risk'].includes(m.status)).length;
   const risk=moves.filter(m=>m.status==='risk').length;
   let ambiguity=1;
   if(legal>=2) ambiguity+=1;
   if(legal>=3) ambiguity+=1;
   if(falseChoices>=2) ambiguity+=1;
   if(legal>=4 && optimal<=2) ambiguity+=1;
   return {moves,legal,optimal,falseChoices,risk,ambiguity:Math.min(5,ambiguity),approximate:complex||risk>0,searchCap:maxStates};

 function countMechanics(level){
   const mechanismTypes=new Set();let traps=0,gates=0,triggers=0,blocked=0;
   for(const t of level.tiles||[]){
     const type=t[1];if(type==='wall'||type==='void')blocked++;

     else if(['doorSwitch','doorPlate','doorToggle'].includes(type)){gates++;mechanismTypes.add(type)}
     else if(['switch','plate','toggle'].includes(type)){triggers++;mechanismTypes.add(type)}

   }
   return {types:mechanismTypes.size,traps,gates,triggers,blocked};

 function classifyMap(level){
   const {cols,rows}=C.dims(level),area=cols*rows;
   const blocked=new Set();let voids=0,walls=0;
   for(const t of level.tiles||[]){if(t[1]==='wall'||t[1]==='void'){blocked.add(t[0]);if(t[1]==='void')voids++;else walls++;}}
   const pass=[];for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){const cell=String.fromCharCode(65+c)+(r+1);if(!blocked.has(cell))pass.push([c,r]);}
   const set=new Set(pass.map(p=>p.join(',')));let components=0,deadEnds=0,junctions=0,degreeSum=0;
   const seen=new Set();
   for(const p of pass){const k=p.join(',');if(seen.has(k))continue;components++;const q=[p];seen.add(k);for(let qi=0;qi<q.length;qi++){const [c,r]=q[qi];for(const [dc,dr] of [[1,0],[-1,0],[0,1],[0,-1]]){const nk=(c+dc)+','+(r+dr);if(set.has(nk)&&!seen.has(nk)){seen.add(nk);q.push([c+dc,r+dr])}}}}
   for(const [c,r] of pass){let d=0;for(const [dc,dr] of [[1,0],[-1,0],[0,1],[0,-1]])if(set.has((c+dc)+','+(r+dr)))d++;degreeSum+=d;if(d<=1)deadEnds++;if(d>=3)junctions++;}
   const blockedRatio=(walls+voids)/area,voidRatio=voids/area,avgDeg=pass.length?degreeSum/pass.length:0;
   let primary='房间型';const tags=[];
   if(components>1){primary='岛屿型';tags.push('多区域');}
   else if(voidRatio>.16){primary='不规则型';}
   else if(blockedRatio<.08){primary='开放型';}
   else if(blockedRatio>.24 && deadEnds>=4){primary='迷宫型';}
   else if(avgDeg<2.25 && deadEnds>=2){primary='走廊型';}
   else if(junctions>=Math.max(4,pass.length*.12)){primary='十字/枢纽型';}
   else if(deadEnds<=1 && avgDeg>1.9 && blockedRatio>.12){primary='环型';}
   if((level.tiles||[]).filter(t=>t[1]==='portal').length>=2)tags.push('传送区域');
   if((level.tiles||[]).filter(t=>['doorSwitch','doorPlate','doorToggle'].includes(t[1])).length>=3)tags.push('多阶段');
   return {primary,tags,components,blockedRatio,voidRatio,avgDegree:avgDeg,deadEnds,junctions};
 }

 function difficultyScore(level,overall,opening,graph){
   const m=countMechanics(level),area=(level.cols||6)*(level.rows||8),pets=(level.animals||[]).length;
   const movePart=Math.min(1,(overall.minMoves||0)/28)*2.1;
   const statePart=Math.min(1,Math.log10(Math.max(10,overall.visited||10))/5.3)*2.0;
   const openingPart=Math.min(1,Math.max(0,opening.ambiguity-1)/4)*1.6;
   const mechPart=Math.min(1,m.types/7)*1.4;
   const petPart=Math.min(1,pets/7)*.8;
   const deadPart=Math.min(1,graph.deadRatio/.55)*1.1;
   const densityPart=Math.min(1,m.blocked/Math.max(1,area)*2.5)*.6;
   const chainPart=Math.min(1,(m.gates+m.triggers)/10)*.4;
   const score=Math.max(0,Math.min(10,movePart+statePart+openingPart+mechPart+petPart+deadPart+densityPart+chainPart));
   const rounded=+score.toFixed(1);let label='入门';if(rounded>=8.2)label='专家';else if(rounded>=6.8)label='困难';else if(rounded>=5.2)label='中等偏难';else if(rounded>=3.5)label='中等';else if(rounded>=2)label='简单';
   return {score:rounded,label,parts:{movePart,statePart,openingPart,mechPart,petPart,deadPart,densityPart,chainPart},mechanics:m};
 }

 function normalizedSet(level,kind){
   const {cols,rows}=C.dims(level),out=new Set();
   function bin(cell){const p=C.parseCell(cell);const x=Math.round((cols<=1?0:p.c/(cols-1))*7),y=Math.round((rows<=1?0:p.r/(rows-1))*7);return x+','+y;}
   if(kind==='shape') for(const t of level.tiles||[]) if(t[1]==='wall'||t[1]==='void') out.add(bin(t[0])+':'+t[1]);
   if(kind==='exit') for(const t of level.tiles||[]) if(t[1]==='exit') out.add(bin(t[0]));
   if(kind==='animals') for(const a of level.animals||[]) out.add(bin(a[1])+':'+(a[2]||''));
   if(kind==='mechanics') for(const t of level.tiles||[]) if(!['wall','void','exit'].includes(t[1])) out.add(bin(t[0])+':'+t[1]);
   return out;
 }
 function jaccard(a,b){if(!a.size&&!b.size)return 1;if(!a.size||!b.size)return 0;let inter=0;for(const x of a)if(b.has(x))inter++;return inter/(a.size+b.size-inter);}

   const shape=jaccard(normalizedSet(a,'shape'),normalizedSet(b,'shape'));
   const exit=jaccard(normalizedSet(a,'exit'),normalizedSet(b,'exit'));
   const animals=jaccard(normalizedSet(a,'animals'),normalizedSet(b,'animals'));
   const mechanics=jaccard(normalizedSet(a,'mechanics'),normalizedSet(b,'mechanics'));
   const areaA=(a.cols||6)*(a.rows||8),areaB=(b.cols||6)*(b.rows||8),size=Math.min(areaA,areaB)/Math.max(areaA,areaB);

   return {overall,shape,exit,animals,mechanics,size};
 }
 function similarityRanking(level,levels,limit=5){
   return (levels||[]).filter(x=>x&&x.id!==level.id).map(other=>({id:other.id,name:other.name||'',...compareLevels(level,other)})).sort((a,b)=>b.overall-a.overall).slice(0,limit);
 }

 function analyzeLevel(level,comparisonLevels=[],opts={}){
   const overall=opts.overall&&opts.overall.solvable?opts.overall:solveAStar(level,{maxStates:opts.solveMax||level.solverMax||1600000});

   const graph=buildReachableGraph(level,{maxStates:opts.graphMax||25000});
   const mapType=classifyMap(level);
   const difficulty=difficultyScore(level,overall,opening,graph);
   const similarity=similarityRanking(level,comparisonLevels,opts.similarityLimit||5);
   return {solvable:true,overall,opening,graph,mapType,difficulty,similarity};
 }

 function solve(level,opts={}){ return solveFrom(level,C.createInitialState(level),opts); }

   return levels.map(level=>{
     const result=solve(level,{maxStates:level.solverMax||900000});
     return {id:level.id,name:level.name,target:level.target,...result,matchesTarget:level.target==null?true:result.minMoves===level.target};
   });
 }

});

function canvasPoint(ev){const r=canvas.getBoundingClientRect();return{x:(ev.clientX-r.left)*W/r.width,y:(ev.clientY-r.top)*H/r.height}}
function inside(p,b){return p.x>=b.x&&p.x<=b.x+b.w&&p.y>=b.y&&p.y<=b.y+b.h}
canvas.tabIndex=0;canvas.addEventListener('pointermove',ev=>{state.pointer=Object.assign(state.pointer,canvasPoint(ev));state.lastInputAt=performance.now();const hit=buttons.find(button=>!button.disabled&&inside(state.pointer,button))?.id||null;if(hit&&hit!==state.hoverButton)audio.play('ui_hover','ui',{cooldown:60,duration:.045});state.hoverButton=hit});canvas.addEventListener('pointerleave',()=>{state.pointer.x=-1;state.pointer.y=-1;state.hoverButton=null});canvas.addEventListener('pointerup',()=>{state.pointer.down=false;state.pressedButton=null});
canvas.addEventListener('pointerdown',ev=>{ev.preventDefault();canvas.focus();audio.play('ui_click','ui');const p=canvasPoint(ev);state.pointer={...state.pointer,...p,down:true};state.lastInputAt=performance.now();for(let i=buttons.length-1;i>=0;i--){const b=buttons[i];if(!b.disabled&&inside(p,b)){state.pressedButton=b.id;handleButton(b.id);return}}if(state.scene!=='game'||state.won||state.failed||state.locked||state.paused||state.hintOpen||state.tutorialOpen||state.objectiveOpen||(BUILD.isStudio&&state.assetPanel))return;let hit=null,best=999,hitR=Math.max(48,layout().cell*.48);for(const v of state.visuals){const a=state.game.animals[v.id];if(a.rescued||a.fallen)continue;const d=Math.hypot(p.x-v.x,p.y-v.y);if(d<hitR&&d<best){best=d;hit=v.id}}if(hit!==null)attempt(hit)},{passive:false});
function handleButton(id){
 if(id==='play'||id==='newGame'){state.pendingLevelIndex=0;goScene('levelIntro')}
 else if(id==='continue'){buildLevel(nextPlayableIndex());goScene('game')}
 else if(id==='chapters'||id==='levelsHome'){state.assetPanel=false;goScene('chapters')}
 else if(id==='levels'){state.selectChapter=Math.floor(state.levelIndex/10);state.paused=false;state.hintOpen=false;state.tutorialOpen=false;state.objectiveOpen=false;state.assetPanel=false;goScene('levels')}
 else if(id==='home'){state.paused=false;state.hintOpen=false;state.tutorialOpen=false;state.objectiveOpen=false;state.assetPanel=false;goScene('home')}
 else if(id==='collection'){state.assetPanel=false;goScene('collection')}
 else if(id==='credits'){state.assetPanel=false;goScene('credits')}
 else if(id==='settings'){state.settingsReturn='home';state.assetPanel=false;goScene('settings')}
 else if(id==='settingsFromPause'){state.settingsReturn='pause';goScene('settings')}
 else if(id==='settingsBack'){if(state.settingsReturn==='pause'){goScene('game');state.paused=true}else goScene('home')}
 else if(id==='toggleMotion')applySettings({...gameSettings,reduceMotion:!gameSettings.reduceMotion})
 else if(id==='toggleTutorials')applySettings({...gameSettings,tutorials:!gameSettings.tutorials})
 else if(id==='toggleMute')applySettings({...gameSettings,mute:!gameSettings.mute})
 else if(id==='toggleReduceMotion')applySettings({...gameSettings,reduceMotion:!gameSettings.reduceMotion})
 else if(id==='toggleCameraShake')applySettings({...gameSettings,cameraShake:!gameSettings.cameraShake})
 else if(id==='toggleAutoHint')applySettings({...gameSettings,autoHint:!gameSettings.autoHint})
 else if(id==='toggleColorAssist')applySettings({...gameSettings,colorAssist:!gameSettings.colorAssist})
 else if(id==='cycleParticles'){const values=['low','medium','high'],index=values.indexOf(gameSettings.particleQuality);applySettings({...gameSettings,particleQuality:values[(index+1)%values.length]})}
 else if(/^(master|music|sfx|ui)(Up|Down)$/.test(id)){const match=id.match(/^(master|music|sfx|ui)(Up|Down)$/),key=match[1],delta=match[2]==='Up' ? .1 : -.1;applySettings({...gameSettings,[key]:Math.round(Math.max(0,Math.min(1,gameSettings[key]+delta))*10)/10});audio.preview(key==='music'?'sfx':key)}
 else if(/^uiScale(Up|Down)$/.test(id)){const delta=id.endsWith('Up') ? .05 : -.05;applySettings({...gameSettings,uiScale:Math.round(Math.max(.8,Math.min(1.25,gameSettings.uiScale+delta))*20)/20})}
 else if(id==='previewAudio')audio.preview('sfx')
 else if(id==='resetTutorials'){tutorialManager.resetAll();addFloat('教程记录已重置',W/2,250)}
 else if(id==='resetSettings')applySettings(settingsStore.reset())
 else if(id==='toggleFullscreen'){if(document.fullscreenElement)document.exitFullscreen?.();else document.querySelector('.app-shell')?.requestFullscreen?.()}
 else if(id==='openStudio'&&BUILD.isStudio){window.open('Hakimi_Studio_V2.0.html','_blank')}
 else if(id==='pause')state.paused=true;
 else if(id==='resume')state.paused=false;
 else if(id==='objective')state.objectiveOpen=true;
 else if(id==='closeObjective')state.objectiveOpen=false;
 else if(id==='hint'){state.hintOpen=true;state.hintTier=1;state.hintsUsed++;state.hintData=null;feedback.emit('hint.shown',{tier:1})}
 else if(id==='hintMore'){if(state.hintTier<4){state.hintTier++;state.hintsUsed++;state.hintData=null;feedback.emit('hint.shown',{tier:state.hintTier})}else state.hintOpen=false}
 else if(id==='closeHint'){state.hintOpen=false;state.hintHighlight=null}
 else if(id==='undo'){state.hintOpen=false;undo()}
 else if(id==='restart'){buildLevel(state.levelIndex);goScene('game')}
 else if(id==='replayTutorial'){const index=state.scene==='levelIntro'?state.pendingLevelIndex:state.levelIndex;if(state.scene==='levelIntro')buildLevel(index);tutorialManager.replay(LEVELS[index].id);state.tutorialOpen=!!tutorialManager.active;state.paused=false;goScene('game')}
 else if(id==='tutorialNext'){tutorialManager.next();state.tutorialOpen=!!tutorialManager.active}
 else if(id==='tutorialSkip'){tutorialManager.skip();state.tutorialOpen=false}
 else if(id==='tutorialNever'){tutorialManager.skip({never:true});state.tutorialOpen=false}
 else if(id==='grid'&&BUILD.isStudio)state.showGrid=!state.showGrid;
 else if(id==='assetPanel'&&BUILD.isStudio)state.assetPanel=true;
 else if(id==='closeAsset')state.assetPanel=false;
 else if(id==='projectImport'&&BUILD.allowProjectImport){document.getElementById('projectPackInput').click()}
 else if(id==='assets'&&BUILD.isStudio){document.getElementById('assetPackInput').click()}
 else if(id==='sampleAssets'&&BUILD.isStudio){Assets.importPack(Assets.samplePack());addFloat('示例素材已载入',W/2,270)}
 else if(id==='clearAssets'&&BUILD.isStudio){Assets.clearAll();addFloat('已恢复原型绘制',W/2,270)}
 else if(id==='next'){state.pendingLevelIndex=Math.min(state.levelIndex+1,LEVELS.length-1);goScene('levelIntro')}
 else if(id==='startPrepared'){buildLevel(state.pendingLevelIndex);goScene('game')}
 else if(id.startsWith('openChapter:')){state.selectChapter=Math.max(0,Math.min(CHAPTERS.length-1,Number(id.split(':')[1])||0));goScene('levels')}
 else if(id.startsWith('chapter:')){state.selectChapter=Math.max(0,Math.min(CHAPTERS.length-1,Number(id.split(':')[1])||0));goScene('levels')}
 else if(id.startsWith('lvl:')){const i=Number(id.split(':')[1]);if(isLevelUnlocked(i)){state.pendingLevelIndex=i;goScene('levelIntro')}}
 else if(id.startsWith('quick:')){const lid=Number(id.split(':')[1]);const i=LEVELS.findIndex(v=>v.id===lid);if(i>=0){state.pendingLevelIndex=i;goScene('levelIntro')}}
}
function applyProject(p){
 if(!p||!Array.isArray(p.levels)||!p.levels.length)throw new Error('bad project');
 PROJECT=p;window.__PAW_PROJECT__=p;THEME=Object.assign(THEME,p.uiTheme||{});syncProjectCatalog(p);
 LEVELS.splice(0,LEVELS.length,...p.levels.map(C.createLevelRuntime));if(p.assets?.slots)Assets.importPack(p.assets);
 CHAPTERS=(p.chapters||[]).map((chapter,index)=>({title:chapter.name||`第 ${index+1} 章`,sub:index===0?'认识回窝路线':index===1?'猫咪互相帮助':index===2?'规划完整联动':'新的猫窝区域',range:`${chapter.from}–${chapter.to}`,icon:index%3===0?'🐾':index%3===1?'🐱':'🏠'}));
 if(!CHAPTERS.length)CHAPTERS=[{title:'全部关卡',sub:'猫咪回窝之旅',range:`1–${LEVELS.length}`,icon:'🐾'}];
 const idx=p.startLevel?LEVELS.findIndex(v=>v.id===Number(p.startLevel)):0;state.levelIndex=idx>=0?idx:0;state.selectChapter=Math.floor(state.levelIndex/10);buildLevel(state.levelIndex);state.tutorialOpen=false;goScene('home');state.assetPanel=false;
}
const projectPackInput=document.getElementById('projectPackInput');if(projectPackInput)projectPackInput.addEventListener('change',e=>{
 const f=e.target.files[0];e.target.value='';if(!f)return;const fr=new FileReader();fr.onload=()=>{try{
  applyProject(JSON.parse(fr.result));addFloat('项目已载入',W/2,270);
 }catch(err){addFloat('项目文件格式错误',W/2,270);}};fr.readAsText(f);
});
const assetPackInput=document.getElementById('assetPackInput');if(assetPackInput)assetPackInput.addEventListener('change',e=>{const f=e.target.files[0];e.target.value='';if(!f)return;const fr=new FileReader();fr.onload=()=>{try{Assets.importPack(JSON.parse(fr.result));addFloat('素材包已载入',W/2,270);}catch(err){addFloat('素材包格式错误',W/2,270);}};fr.readAsText(f);});
window.addEventListener('keydown',e=>{const k=e.key.toLowerCase();state.lastInputAt=performance.now();if(BUILD.isStudio&&k==='g')state.showGrid=!state.showGrid;if(k==='r'&&state.scene==='game'&&!state.tutorialOpen)buildLevel(state.levelIndex);if(k==='m')applySettings({...gameSettings,mute:!gameSettings.mute});if((e.ctrlKey||e.metaKey)&&k==='z')undo();if(['arrowdown','arrowright','arrowup','arrowleft'].includes(k)&&buttons.length){e.preventDefault();const direction=k==='arrowdown'||k==='arrowright'?1:-1;let next=state.focusIndex;for(let guard=0;guard<buttons.length;guard++){next=(next+direction+buttons.length)%buttons.length;if(!buttons[next].disabled){state.focusIndex=next;break}}audio.play('ui_hover','ui')}if((k==='enter'||k===' ')&&state.focusIndex>=0&&buttons[state.focusIndex]&&!buttons[state.focusIndex].disabled){e.preventDefault();handleButton(buttons[state.focusIndex].id)}if(k==='escape'){if(BUILD.isStudio&&state.assetPanel)state.assetPanel=false;else if(state.tutorialOpen){tutorialManager.skip();state.tutorialOpen=false}else if(state.objectiveOpen)state.objectiveOpen=false;else if(state.hintOpen)state.hintOpen=false;else if(state.scene==='game')state.paused=!state.paused;else if(state.scene==='levels')goScene('chapters');else if(state.scene==='chapters'||state.scene==='collection'||state.scene==='credits'||state.scene==='settings')goScene('home');else if(state.scene==='levelIntro')goScene('levels')}});
window.addEventListener('message',event=>{if(event.data?.type==='hakimi-load-project'){try{applyProject(event.data.project);event.source?.postMessage({type:'hakimi-project-loaded'},'*')}catch(err){console.error('Studio 项目载入失败',err)}}});
function loop(now){const dt=Math.min(.033,(now-state.lastTime)/1000);state.lastTime=now;update(dt);draw();requestAnimationFrame(loop)}
window.HakimiGameV10Test={version:Experience.VERSION,build:BUILD,getScene:()=>state.scene,getSettings:()=>({...gameSettings}),getTutorial:()=>tutorialManager.active?{...tutorialManager.active}:null,getState:()=>({scene:state.scene,levelId:level()?.id,moves:state.moves,won:state.won,failed:state.failed,paused:state.paused,tutorialOpen:state.tutorialOpen,history:state.history.length}),goScene,handleButton,emit:(type,payload)=>feedback.emit(type,payload),resetTutorials:()=>tutorialManager.resetAll(),feedbackEvents:Experience.FEEDBACK_EVENTS};
if(!window.__PAW_PROJECT_LOADED__)Assets.loadStored();const bootScene=BUILD.isPlayer?'splash':'home';buildLevel(state.levelIndex);state.tutorialOpen=false;state.scene=bootScene;state.sceneEnteredAt=performance.now();audio.setMusic('music.menu');requestAnimationFrame(loop);
})();

</script>
